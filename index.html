<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebacat</title>
    <!-- Icona della tabella / Favicon quadrata -->
    <link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_aon339aon339aon3.jpeg">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1c1e21;
            margin: 0;
            padding: 0;
        }
        header {
            background: #ffffff;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .main-logo {
            height: 35px;
            object-fit: contain;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #ccd0d5;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-header {
            padding: 12px 15px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }
        .card-body img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-footer {
            padding: 12px 15px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #eee;
        }
        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #166fe5;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo principale in alto -->
        <img src="Gemini_Generated_Image_sg3584sg3584sg35.jpeg" alt="facebacat" class="main-logo">
        <div id="user-info" style="font-size: 14px; color: #65676b;"></div>
    </header>

    <div class="container" id="feed-container">
        <!-- I contenuti dei gatti caricati dall'API compariranno qui -->
        <div class="card">
            <div class="card-header">Benvenuto su facebacat! 🐱</div>
            <div class="card-body" style="padding: 20px; text-align: center; color: #65676b;">
                Caricamento dei gatti in corso...
            </div>
        </div>
    </div>

</body>
</html>
